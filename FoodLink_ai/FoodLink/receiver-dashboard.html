<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receiver Dashboard — FoodLink</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg fl-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Food<span>Link</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#flNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="flNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link active" href="receiver-dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="available-food.html">View Available Food</a></li>
        <li class="nav-item"><a class="nav-link" href="receiver-history.html">My Requests</a></li>
        <li class="nav-item"><a class="nav-link btn-logout" href="#">Logout</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="dashboard-header">
  <div class="container">
    <h2 class="mb-1" id="welcomeName">Welcome back</h2>
    <p class="mb-0">Here's an overview of your food request activity.</p>
  </div>
</div>

<section class="section pt-4">
  <div class="container">
    <div class="row g-4 mb-5">
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-number" id="statAvailable">0</div>
          <div class="stat-label">Available Donations</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-number" id="statRequested">0</div>
          <div class="stat-label">Requested Donations</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="stat-card">
          <div class="stat-number" id="statReceived">0</div>
          <div class="stat-label">Received Donations</div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-sm-6 col-lg-3">
        <a href="available-food.html" class="dash-action-btn">
          <i class="bi bi-search icon"></i>
          View Available Food
        </a>
      </div>
      <div class="col-sm-6 col-lg-3">
        <a href="receiver-history.html" class="dash-action-btn">
          <i class="bi bi-clock-history icon"></i>
          My Requests
        </a>
      </div>
      <div class="col-sm-6 col-lg-3">
        <a href="receiver-register.html" class="dash-action-btn">
          <i class="bi bi-person-circle icon"></i>
          Profile
        </a>
      </div>
      <div class="col-sm-6 col-lg-3">
        <a href="#" class="dash-action-btn btn-logout">
          <i class="bi bi-box-arrow-right icon"></i>
          Logout
        </a>
      </div>
    </div>
  </div>
</section>

<footer class="fl-footer">
  <div class="container">
    <div class="footer-bottom">&copy; 2026 FoodLink. All rights reserved.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    requireAuth('receiver', 'receiver-login.html').then(function (user) {
      if (!user) return;
      document.getElementById('welcomeName').textContent = 'Welcome back, ' + user.name;
      loadReceiverStats();
    });
  });
</script>
</body>
</html>
