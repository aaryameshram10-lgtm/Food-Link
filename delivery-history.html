<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<body>

<nav class="navbar navbar-expand-lg fl-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Food<span>Link</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#flNav">
      <span class="navbar-toggler-icon"></span>

    <div class="collapse navbar-collapse" id="flNav">

        <li class="nav-item"><a class="nav-link" href="available-deliveries.html">Available Deliveries</a></li>

        <li class="nav-item"><a class="nav-link btn-logout" href="#">Logout</a></li>

    <div class="section-title">
      <h2>Delivery History</h2>
      <p>Deliveries you've accepted, picked up, or completed.</p>
    </div>

    <div class="table-responsive">
      <table class="table fl-table align-middle">
        <thead>
          <tr>
            <th>Food Name</th>
            <th>Pickup From</th>
            <th>Deliver To</th>
            <th>Pickup Time</th>

          </tr>
        </thead>
        <tbody id="deliveryHistoryBody"></tbody>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    requireAuth('volunteer', 'volunteer-login.html').then(function (user) {

      loadDeliveryHistory();
    });
  });
